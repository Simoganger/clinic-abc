<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic · Patients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-semibold"><i class="bi bi-heart-pulse-fill me-2"></i>Clinic</span>
      <span id="apiStatus" class="badge rounded-pill text-bg-secondary">API: checking…</span>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Header + toolbar -->
    <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
      <div>
        <h1 class="h3 mb-0">Patients</h1>
        <small class="text-secondary"><span id="patientCount">0</span> records</small>
      </div>
      <div class="d-flex gap-2">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input id="searchInput" type="search" class="form-control" placeholder="Search name or email…">
        </div>
        <button id="newPatientBtn" class="btn btn-primary text-nowrap">
          <i class="bi bi-person-plus-fill me-1"></i>New patient
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Date of birth</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Blood</th>
              <th>Contact</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="patientsTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="text-center text-secondary py-5 d-none">
        <i class="bi bi-people display-6 d-block mb-2"></i>
        No patients found.
      </div>
      <div id="loadingState" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </main>

  <!-- Create / Edit modal -->
  <div class="modal fade" id="patientModal" tabindex="-1" aria-labelledby="patientModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form id="patientForm" class="modal-content" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="patientModalTitle">New patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="formAlert" class="alert alert-danger d-none"></div>
          <input type="hidden" name="id">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="first_name">First name *</label>
              <input class="form-control" id="first_name" name="first_name" required maxlength="50">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="last_name">Last name *</label>
              <input class="form-control" id="last_name" name="last_name" required maxlength="50">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="date_of_birth">Date of birth *</label>
              <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="gender">Gender *</label>
              <select class="form-select" id="gender" name="gender" required>
                <option value="">Choose…</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="blood_type">Blood type</label>
              <select class="form-select" id="blood_type" name="blood_type">
                <option value="">Unknown</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" name="email" maxlength="100">
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="phone">Phone</label>
              <input type="tel" class="form-control" id="phone" name="phone" maxlength="20" placeholder="+39 333 1234567">
              <div class="invalid-feedback"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <span class="spinner-border spinner-border-sm me-1 d-none" id="saveSpinner"></span>Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete confirm modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill text-danger me-2"></i>Delete patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete <strong id="deletePatientName"></strong>? This cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
